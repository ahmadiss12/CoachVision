name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest coachvision/tests -v

      # Regression gate for the exercise counters. The clips are regenerated
      # rather than committed (seeded, so the result is deterministic), and the
      # run fails if any exercise scores below backend/BASELINE.md. See
      # docs/COUNTER_BENCHMARK.md.
      - name: Benchmark counters against baseline
        run: |
          python scripts/make_synthetic_clips.py
          python scripts/benchmark_counters.py --per-clip --check BASELINE.md
